function nearest(lat,lon,n=7){return DATA.map(x=>({...x,d:hav(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.d-b.d).slice(0,n)}

function orux(lat,lon,name){
 const label=encodeURIComponent(name||`${lat},${lon}`);
 // Named geo point. Orux can receive the coordinate and label.
 location.href=`geo:${lat},${lon}?q=${lat},${lon}(${label})`;
}
function xgisArea(id){
 location.href=`https://xgis.maaamet.ee/xgis2/page/app/karuputk?searchid=FMA_KATUPUTKNEW&showsearchlayer=1&koloonia_id=${encodeURIComponent(id)}`;
}
function xgisPoint(lat,lon){
 location.href='https://xgis.maaamet.ee/xgis2/page/app/maainfo';
}

function nearbyHtml(lat,lon){
 const xs=nearest(lat,lon,7);
 return `<div class="nearby"><div class="nearby-title">Lähimad karuputke alad</div>
 <table><thead><tr><th>Ala</th><th class="num">Kaugus</th><th class="num">Suurus</th><th>Tõrjeüksus</th></tr></thead><tbody>`+
 xs.map(x=>`<tr>
 <td><span class="idlink" onclick="orux(${x.lat},${x.lon},'${esc(x.id)}')" title="Ava ${esc(x.id)} Oruxis">${esc(x.id)}</span></td>
 <td class="num">${fmtD(x.d)}</td><td class="num">${fmtHa(x.area)}</td><td class="unit">${esc(x.unit||'')}</td>
 </tr>`).join('')+`</tbody></table></div>`;
}


const placeCache=new Map();
let placeReqSeq=0;

function wgsToLest97(lat,lon){
 const a=6378137.0, f=1/298.257222101, e2=f*(2-f), ep2=e2/(1-e2);
 const k0=.9996, FE=500000, FN=6375000;
 const phi=lat*Math.PI/180, lam=lon*Math.PI/180;
 const phi0=(57+31/60+3.19415/3600)*Math.PI/180, lam0=24*Math.PI/180;
 const s=Math.sin(phi), c=Math.cos(phi), t=Math.tan(phi);
 const N=a/Math.sqrt(1-e2*s*s), T=t*t, C=ep2*c*c, A=(lam-lam0)*c;
 function M(p){
   return a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*p
    -(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*p)
    +(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*p)
    -(35*e2*e2*e2/3072)*Math.sin(6*p));
 }
 const x=FE+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
 const y=FN+k0*(M(phi)-M(phi0)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
 return {x,y};
}

function reversePlace(lat,lon,done){
 const key=lat.toFixed(5)+','+lon.toFixed(5);
 if(placeCache.has(key)){done(placeCache.get(key));return}
 const p=wgsToLest97(lat,lon), cb='__place_'+(++placeReqSeq), s=document.createElement('script');
 window[cb]=function(data){
   try{delete window[cb]}catch(e){}
   if(s.parentNode)s.remove();
   const arr=(data&&data.addresses)||[];
   let a=arr.find(v=>v.asustusyksus)||arr[0]||null;
   let value='';
   if(a){
     const village=a.asustusyksus||'';
     const county=a.maakond||'';
     value=[village,county].filter(Boolean).join(', ');
   }
   placeCache.set(key,value);
   done(value);
 };
 s.onerror=function(){
   try{delete window[cb]}catch(e){}
   if(s.parentNode)s.remove();
   placeCache.set(key,'');
   done('');
 };
 const params=new URLSearchParams({
   x:String(Math.round(p.x)),
   y:String(Math.round(p.y)),
   nearest:'1',
   ihist:'0',
   callback:cb
 });
 s.src='https://inaadress.maaamet.ee/inaadress/gazetteer?'+params.toString();
 document.head.appendChild(s);
}

function fillAreaPlaces(){
 document.querySelectorAll('[data-place-lat][data-place-lon]').forEach(el=>{
   if(el.dataset.loaded==='1')return;
   el.dataset.loaded='1';
   const lat=Number(el.dataset.placeLat), lon=Number(el.dataset.placeLon);
   reversePlace(lat,lon,place=>{
     if(place) el.textContent=place+' · ';
     else el.textContent='';
   });
 });
}

function renderAreaResults(xs){
 if(!xs||!xs.length)return false;
 r.innerHTML=xs.map(x=>`<div class="result-item">
 <div class="addrrow"><div><div class="addr">${esc(x.id)}</div>
 <div class="sug-meta"><span class="locality" data-place-lat="${x.lat}" data-place-lon="${x.lon}"></span>${fmtHa(x.area)} · ${esc(x.unit||'')}</div></div>
 <div class="actions"><button class="orux" onclick="orux(${x.lat},${x.lon},'${esc(x.id)}')">ORUX</button>
 <button class="xgis" onclick="xgisArea('${esc(x.id)}')">X-GIS</button></div></div>
 </div>`).join('');
 fillAreaPlaces();
 return true;
}
function showAreas(key){
 const xs=byId.get(key);
 if(!xs)return false;
 return renderAreaResults(xs);
}
function areaPrefixMatches(key,limit=30){
 if(!key)return [];
 const out=[];
 for(const x of DATA){
   if(x.id.toUpperCase().startsWith(key)){
     out.push(x);
     if(out.length>=limit)break;
   }
 }
 return out;
}
function showAreaSuggestions(key){
 const xs=areaPrefixMatches(key,30);
 if(!xs.length)return false;
 r.innerHTML='<div class="suggestions">'+xs.map(x=>`<div class="suggestion area-sug" onclick="q.value='${esc(x.id)}';showAreas('${esc(x.id.toUpperCase())}')">
   <div><div class="sug-name">${esc(x.id)}</div>
   <div class="sug-meta"><span class="locality" data-place-lat="${x.lat}" data-place-lon="${x.lon}"></span>${fmtHa(x.area)} · ${esc(x.unit||'')}</div></div>
   <div class="sug-meta">${x.lat.toFixed(5)}, ${x.lon.toFixed(5)}</div>
 </div>`).join('')+'</div>';
 fillAreaPlaces();
 return true;
}

function pickAddress(a){
 const lat=Number(a.viitepunkt_b), lon=Number(a.viitepunkt_l);
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 const place=a.asustusyksus||a.aadresstekst||a.taisaadress||a.ipikkaadress||q.value.trim();
 const county=a.maakond||'';
 const display=[place,county].filter(Boolean).join(', ');
 q.value=place;
 r.innerHTML=`<div class="addrrow">
 <div><div class="addr">${esc(display)}</div><div class="sug-meta">${lat.toFixed(6)}, ${lon.toFixed(6)}</div></div>
 <div class="actions"><button class="orux" onclick="orux(${lat},${lon},'${esc(place)}')">ORUX</button>
 <button class="xgis" onclick="xgisPoint(${lat},${lon})">X-GIS</button></div></div>
 ${nearbyHtml(lat,lon)}`;
}

function gazetteer(term){
 const my=++reqNo, cb='__gaz_'+my, s=document.createElement('script');
 window[cb]=function(data){
   try{delete window[cb]}catch(e){}
   if(s.parentNode)s.remove();
   if(my!==reqNo)return;
   const arr=(data&&data.addresses)||[];
   if(!arr.length){r.innerHTML=`<b>${esc(term)}</b><br>Vasteid ei leitud.`;return}
   // Keep distinct useful-looking results.
   const seen=new Set(), out=[];
   for(const a of arr){
     const place=a.asustusyksus||a.aadresstekst||a.taisaadress||a.ipikkaadress||'';
     const county=a.maakond||'';
     const k=place+'|'+county;
     if(place&&!seen.has(k)){seen.add(k);out.push(a)}
     if(out.length>=8)break;
   }
   r.innerHTML='<div class="suggestions">'+out.map((a,i)=>{
     const place=a.asustusyksus||a.aadresstekst||a.taisaadress||a.ipikkaadress||term;
     const county=a.maakond||'';
     const municipality=a.omavalitsus||a.vald||'';
     const meta=[municipality,county].filter(Boolean).join(', ');
     return `<div class="suggestion" data-i="${i}"><div class="sug-name">${esc(place)}</div><div class="sug-meta">${esc(meta)}</div></div>`;
   }).join('')+'</div>';
   [...r.querySelectorAll('.suggestion')].forEach(el=>el.onclick=()=>pickAddress(out[Number(el.dataset.i)]));
 };
 s.onerror=function(){if(my===reqNo)r.innerHTML='Aadressiotsing ei vastanud.';try{delete window[cb]}catch(e){};if(s.parentNode)s.remove()};
 const p=new URLSearchParams({address:term,results:'20',ihist:'0',callback:cb});
 s.src='https://inaadress.maaamet.ee/inaadress/gazetteer?'+p.toString();
 document.head.appendChild(s);
}

function react(commit=false){
 clearTimeout(timer);
 const raw=q.value.trim(), key=raw.toUpperCase().replace(/\s+/g,'');
 if(!raw){
   r.innerHTML='Sisesta tõrjeüksuse ID või vähemalt 3 tähte kohanimest/aadressist.';
   return;
 }

 // Täpne tõrjeüksuse ID.
 if(byId.has(key)){
   if(commit) showAreas(key);
   else showAreaSuggestions(key);
   return;
 }

 // Tõrjeüksuse prefiks, nt RA0 -> RA0xx...
 // ID-prefiksi režiimi läheme ainult siis, kui sisendis on juba number.
 // Nii jäävad "Roo", "Ros", "Erv" jms alati kohanime/aadressi otsingusse.
 if(/^[A-ZÕÄÖÜ]{1,4}\d+$/.test(key) && key.length>=2){
   const xs=areaPrefixMatches(key, commit ? 200 : 30);
   if(xs.length){
     if(commit) renderAreaResults(xs);
     else showAreaSuggestions(key);
   }else{
     r.innerHTML=`<b>${esc(key)}</b><br>Tõrjeüksuse vasteid ei leitud.`;
   }
   return;
 }

 // Aadressi/kohanime otsing.
 if(raw.length<3){
   r.innerHTML='<span class="status">Kirjuta vähemalt 3 tähte…</span>';
   return;
 }
 r.innerHTML='<span class="status">Otsin…</span>';

 // Kiirem reageering: 120 ms pärast viimast klahvivajutust.
 timer=setTimeout(()=>gazetteer(raw),120);
}
q.addEventListener('input',()=>react(false));
q.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
   e.preventDefault();
   react(true);
   q.blur();
 }
});
</script></main></body></html>
