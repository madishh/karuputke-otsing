name: Build Shizuku Deep OBD APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/shizuku-deepobd-zip/**'
      - '.github/workflows/shizuku-deepobd-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/shizuku-deepobd-zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuDeepOBDZip-debug-apk
          path: tools/shizuku-deepobd-zip/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
